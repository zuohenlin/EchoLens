services:
  echolens-insight:
    # 预构建镜像（推荐）：由 GitHub Actions 自动构建并推送到 GHCR
    image: ghcr.io/zuohenlin/echolens-insight:latest
    # 本地构建（可选，代码有大改动时使用）：
    # build: ./third_party/EchoLens-Insight
    container_name: echolens-insight
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_ENABLE_FILE_WATCHER=false
    ports:
      - "5000:5000"
      - "8501:8501"
      - "8502:8502"
      - "8503:8503"
    depends_on:
      - echolens-insight-db
    volumes:
      - ./third_party/EchoLens-Insight-Data/logs:/app/logs
      - ./third_party/EchoLens-Insight-Data/final_reports:/app/final_reports
      - ./third_party/EchoLens-Insight-Data/insight_engine_streamlit_reports:/app/insight_engine_streamlit_reports
      - ./third_party/EchoLens-Insight-Data/media_engine_streamlit_reports:/app/media_engine_streamlit_reports
      - ./third_party/EchoLens-Insight-Data/query_engine_streamlit_reports:/app/query_engine_streamlit_reports
    env_file:
      - ./third_party/EchoLens-Insight/.env

  echolens-insight-db:
    image: postgres:15
    container_name: echolens-insight-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: echolens_insight
      POSTGRES_PASSWORD: echolens_insight
      POSTGRES_DB: echolens_insight
    ports:
      - "5444:5432"
    volumes:
      - ./third_party/EchoLens-Insight-Data/db_data:/var/lib/postgresql/data
    env_file:
      - ./third_party/EchoLens-Insight/.env
